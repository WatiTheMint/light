<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Пока горит свет</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Пять последних ночей смотрительницы маяка: веди лодки домой лучом сквозь туман.">
<meta name="theme-color" content="#0b0b0b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="sea" role="img" aria-label="Ночное море, маяк на мысе и рыбацкие лодки"></canvas>

<div id="hud" hidden>
  <div class="hud-night"><span id="hudNum">I</span><span class="hud-lbl">ночь</span></div>
  <div id="tally" role="list" aria-label="Лодки этой ночи"></div>
  <div class="hud-btns">
    <button id="muteBtn" class="icon-btn" type="button" aria-label="Выключить звук" aria-pressed="false">
      <svg class="ico-on" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18V6L7.5 9.5H4z"/><path d="M15.5 9a4 4 0 0 1 0 6"/><path d="M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>
      <svg class="ico-off" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18V6L7.5 9.5H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
    </button>
    <button id="pauseBtn" class="icon-btn" type="button" aria-label="Пауза">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M9 6.5v11M15 6.5v11"/></svg>
    </button>
  </div>
  <p id="caption" aria-live="polite"></p>
  <p id="hint" aria-live="polite"></p>
  <button id="hornBtn" class="horn" type="button" aria-label="Ревун" title="Ревун · пробел" hidden>
    <svg viewBox="0 0 64 64" aria-hidden="true">
      <circle class="horn-track" cx="32" cy="32" r="29"/>
      <circle id="hornRing" class="horn-ring" cx="32" cy="32" r="29"/>
      <circle cx="23" cy="32" r="3.2" class="horn-dot"/>
      <path class="horn-wave" d="M29 23.5a10 10 0 0 1 0 17M34.5 18.5a16.5 16.5 0 0 1 0 27"/>
    </svg>
  </button>
</div>

<div id="nightCard" aria-hidden="true"><span id="ncNum"></span><span id="ncTitle"></span></div>

<section id="title" class="screen" aria-labelledby="gameTitle">
  <div class="title-col">
    <svg class="glyph" viewBox="0 0 40 56" aria-hidden="true">
      <path d="M14 53 16.6 21h6.8L26 53z"/><path d="M14.6 21h10.8"/><path d="M17 13.5h6V21h-6z"/><path d="M16.2 13.5 20 9l3.8 4.5"/>
      <path d="M15.4 33h9.2M14.8 43h10.4"/><path d="M9 53h22"/><path class="glyph-beam" d="M5 14.5l9.5 2.2M35 14.5l-9.5 2.2"/>
      <circle cx="20" cy="17.2" r="1.3" class="glyph-lamp"/>
    </svg>
    <h1 id="gameTitle">Пока горит свет</h1>
    <p class="sub">пять последних ночей на маяке мыса Тихого</p>
    <div class="actions">
      <button id="continueBtn" class="btn" type="button" hidden>Продолжить</button>
      <button id="startBtn" class="btn primary" type="button">Зажечь фонарь</button>
    </div>
    <p class="foot">Свет ведёт мышь или палец<span class="sep" aria-hidden="true">·</span>Пробел — ревун<span class="sep" aria-hidden="true">·</span>Лучше со звуком</p>
  </div>
</section>

<section id="journal" class="screen paper" hidden aria-labelledby="jTitle">
  <article class="page">
    <header>
      <svg class="glyph ink" viewBox="0 0 40 56" aria-hidden="true">
        <path d="M14 53 16.6 21h6.8L26 53z"/><path d="M14.6 21h10.8"/><path d="M17 13.5h6V21h-6z"/><path d="M16.2 13.5 20 9l3.8 4.5"/>
        <path d="M15.4 33h9.2M14.8 43h10.4"/><path d="M9 53h22"/>
        <circle cx="20" cy="17.2" r="1.3" class="glyph-lamp"/>
      </svg>
      <span class="kicker">Дневник смотрительницы</span>
      <h2 id="jTitle"></h2>
    </header>
    <div id="jText"></div>
    <div id="jTally"></div>
    <div class="page-actions"><button id="jBtn" class="btn primary ink" type="button">Зажечь фонарь</button></div>
  </article>
</section>

<section id="pause" class="screen veil" hidden aria-labelledby="pauseTitle">
  <div class="menu-col">
    <h2 id="pauseTitle">Пауза</h2>
    <button id="resumeBtn" class="btn primary" type="button">Вернуться к морю</button>
    <button id="pMuteBtn" class="btn" type="button">Звук: вкл</button>
    <button id="menuBtn" class="btn" type="button">В начало</button>
  </div>
</section>

<div id="finalPrompt" hidden>
  <p class="fp-line">Все дома.</p>
  <button id="extBtn" class="btn primary" type="button">Погасить фонарь</button>
</div>

<script src="js/story.js"></script>
<script src="js/world.js"></script>
<script src="js/render.js"></script>
<script src="js/audio.js"></script>
<script src="js/main.js"></script>
</body>
</html>
